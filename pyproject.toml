[project]
name = "mneme"
version = "0.1.0"
description = "Personal knowledge base with RAG chat and spaced-repetition flashcards. Single-user pet project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Oleksandr Likhachov" }]

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    # db
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    # config
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    # http / llm
    "httpx>=0.28",
    "openai>=1.55",
    # orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # mcp
    "mcp>=1.0",
    # aws
    "aioboto3>=13.4",
    # logging
    "structlog>=24.4",
    # auth
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=23.1",
    # ingest
    "tiktoken>=0.8",
    "pymupdf>=1.25",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
evals = [
    "ragas>=0.2",
    "deepeval>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres,localstack]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
package = false
