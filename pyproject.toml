[project]
name = "mneme"
version = "0.1.0"
description = "Personal knowledge base with RAG chat and spaced-repetition flashcards. Single-user pet project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Oleksandr Likhachov" }]

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    # db
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    # config
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    # http / llm
    "httpx>=0.28",
    "openai>=1.55",
    # orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # mcp
    "mcp>=1.0",
    # aws
    "aioboto3>=13.4",
    # logging
    "structlog>=24.4",
    # auth
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=23.1",
    # ingest
    "tiktoken>=0.8",
    "pymupdf>=1.25",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
evals = [
    "ragas>=0.2",
    "deepeval>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres,localstack]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "mcp_server", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "N",
    "S",
    "A",
    "C4",
    "SIM",
    "RET",
    "PT",
    "PL",
    "RUF",
    "TID",
    "ASYNC",
]
ignore = [
    "E501",
    "PLR0913",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]
"evals/**" = ["S"]
"alembic/**" = ["N"]
"app/logging.py" = ["A005"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp_server"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["app.main", "app.api.*", "mcp_server.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
