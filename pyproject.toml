[project]

name = "mneme"
version = "0.1.0"
description = "Personal knowledge base with RAG chat and spaced-repetition flashcards. Single-user pet project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Oleksandr Likhachov" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.28",
    "pgvector>=0.2",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "openai>=1.23",
    "langgraph>=0.0.38",
    "langchain-core>=0.1.21",
    "mcp>=1.0",
    "aioboto3>=11.1",
    "structlog>=23.1",
    "pyjwt[crypto]>=2.7",
    "argon2-cffi>=21.3",
    "tiktoken>=0.5",
    "pymupdf>=1.22",
    "trafilatura>=1.7",
]

[project.optional-dependencies]
evals = [
    "ragas>=0.2",
    "deepeval>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres,localstack]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "mcp_server", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "N",
    "S",
    "A",
    "C4", "SIM", "RET", "PT", "PL", "RUF", "TID", "ASYNC"
]
ignore = [
    "E501",
    "PLR0913",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]
"evals/**" = ["S"]
"migrations/**" = ["N"]
"app/logging.py" = ["A005"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp_server"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["app.main", "app.api.*", "mcp_server.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
